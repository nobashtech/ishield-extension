name: Extension CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: npm ci
      - name: Privacy, filter, update and release guards
        run: npm run ci
      - name: Build deterministic development packages
        run: python3 scripts/build_packages.py
